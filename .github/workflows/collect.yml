name: Collect and Deploy

# Ingests AMD nightly perf-eval results from Buildkite artifacts, rebuilds the
# published payload, and deploys the static site.
#
# Branch model:
#   dashboard-state  data/events.jsonl (unpublished, but readable by anyone who can read the repo)
#   gh-pages         built site + perf_eval.json
#   main             source only
on:
  schedule:
    # The nightly's schedule lives in the Buildkite UI, so these hours are a
    # hedge. Recent nightlies mostly finished 10:30-13:00 UTC; 17:17 usually
    # picks the new one up.
    - cron: '17 1,9,17 * * *'
  # A change to the page itself has to be able to reach production. Without
  # this, a UI edit would wait for the next scheduled run and then be skipped
  # by the unchanged-payload check below, because the data did not move.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/collect.yml'
  repository_dispatch:
    types: [perf_eval_build_finished]
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of Buildkite history to scan (1-30)'
        required: false
        default: '14'
      recheck_builds:
        description: >-
          Re-list the newest N nightlies even if already ingested (0-60). Blank
          uses the collector default of 3; raise it once to backfill artifacts
          an earlier collector version missed.
        required: false
        default: ''
      deploy:
        description: 'Deploy to gh-pages after collecting'
        required: false
        type: boolean
        default: true

# Serialize: two runs pushing dashboard-state or gh-pages would race.
concurrency:
  group: perf-eval-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to the same commit SHAs vllm-ci-dashboard uses.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      # Runtime packages only, at the exact versions in constraints.txt. This
      # job holds the Buildkite token and a write token, so nothing runs here
      # that the collector does not need; the test and lint tools run in CI.
      - name: Install dependencies
        run: pip install -c constraints.txt requests pyyaml truststore

      - name: Validate workflow inputs
        env:
          RAW_DAYS: ${{ inputs.days }}
          RAW_RECHECK: ${{ inputs.recheck_builds }}
        run: |
          set -euo pipefail
          DAYS="${RAW_DAYS:-14}"
          if ! printf '%s' "$DAYS" | grep -Eq '^[1-9][0-9]?$'; then
            echo "::error::days must be a positive integer" && exit 1
          fi
          if [ "$DAYS" -gt 30 ]; then
            echo "::error::days must be 30 or fewer" && exit 1
          fi
          echo "COLLECT_DAYS=$DAYS" >> "$GITHUB_ENV"
          if [ -n "${RAW_RECHECK:-}" ]; then
            if ! printf '%s' "$RAW_RECHECK" | grep -Eq '^[0-9]{1,2}$' || [ "$RAW_RECHECK" -gt 60 ]; then
              echo "::error::recheck_builds must be an integer from 0 to 60" && exit 1
            fi
            echo "RECHECK_BUILDS=$RAW_RECHECK" >> "$GITHUB_ENV"
          fi

      # Authenticated with an extra header rather than a rewritten remote, so
      # the token is not left in .git/config for later steps. A missing branch
      # (ls-remote exit 2) is a first run; any other failure stops the run,
      # because starting from an empty store would later overwrite the real
      # one and lose everything older than the lookback.
      - name: Restore the event store
        env:
          STATE_BRANCH: dashboard-state
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          mkdir -p data
          set +e
          git -c http.extraheader="$AUTH" ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git -c http.extraheader="$AUTH" fetch --depth=1 origin "$STATE_BRANCH"
            git show "FETCH_HEAD:data/events.jsonl" > data/events.jsonl
            echo "Restored $(wc -l < data/events.jsonl) records from $STATE_BRANCH."
          elif [ "$status" -eq 2 ]; then
            : > data/events.jsonl
            echo "No $STATE_BRANCH branch yet; starting from an empty store."
          else
            echo "::error::Could not reach origin to restore $STATE_BRANCH (git exit $status)."
            exit 1
          fi

      # The deploy check compares against what is actually live. A copy saved
      # alongside the event store would be written before the deploy runs, so
      # a failed or skipped deploy would still count as published and the
      # site would stay stale.
      - name: Fetch the published payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c http.extraheader="$AUTH" fetch --depth=1 origin gh-pages 2>/dev/null \
             && git show "FETCH_HEAD:perf_eval.json" > /tmp/previous_perf_eval.json 2>/dev/null; then
            echo "Fetched the live payload from gh-pages."
          else
            rm -f /tmp/previous_perf_eval.json
            echo "No published payload yet; treating this run as changed."
          fi

      # Fails closed on a malformed store before anything overwrites it, and
      # applies retention so a legacy unbounded log is migrated in place.
      - name: Validate and bound the event store
        run: python scripts/perf_eval/merge_events.py --local data/events.jsonl

      # The only step that receives the Buildkite token.
      #
      # Request cost per run: one builds listing, three artifact listings per
      # nightly still inside the re-check window, and one download per new
      # artifact. Already-ingested older builds are not re-listed, so steady
      # state is single digits plus the new nightly's artifacts. The ceiling
      # aborts rather than hammering the API if that ever stops being true.
      - name: Ingest Buildkite artifacts
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/perf_eval/collect_artifacts.py \
            --days "$COLLECT_DAYS" \
            --store data/events.jsonl \
            --max-requests 1500 \
            ${RECHECK_BUILDS:+--recheck-builds "$RECHECK_BUILDS"}

      - name: Aggregate the published payload
        run: |
          set -euo pipefail
          python scripts/perf_eval/aggregate.py \
            --store data/events.jsonl \
            --output data/perf_eval.json

      # The unit tests run in CI against the same code. What only this run
      # can check is the payload it just built, before anything is persisted
      # or published.
      - name: Sanity-check the fresh payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path("data/perf_eval.json").read_text(encoding="utf-8"))
          problems = []
          for key in ("generated_at", "models", "summary", "baselines", "metric_meta"):
              if key not in payload:
                  problems.append(f"missing {key}")
          if not isinstance(payload.get("models"), list):
              problems.append("models is not a list")
          summary = payload.get("summary") or {}
          if summary.get("perf_points", 0) and not payload.get("models"):
              problems.append("perf points counted but no models published")
          if problems:
              print("::error::Payload failed sanity checks: " + "; ".join(problems))
              sys.exit(1)
          print(f"Payload OK: {summary.get('models')} models, {summary.get('perf_points')} perf points, "
                f"{summary.get('accuracy_points')} accuracy points.")
          PY

      # aggregate.py restamps generated_at every run, so the payload always
      # differs byte-wise. Publishing on that alone burns a Pages build to
      # republish identical numbers, and Pages allows only ~10 builds an hour.
      - name: Has anything actually changed?
        id: changed
        run: |
          set -euo pipefail
          python scripts/perf_eval/payload_changed.py \
            --current data/perf_eval.json \
            --previous /tmp/previous_perf_eval.json

      - name: Persist the event store
        env:
          STATE_BRANCH: dashboard-state
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORKTREE="$(mktemp -d)"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git -c http.extraheader="$AUTH" ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::Could not reach origin to persist $STATE_BRANCH (git exit $status)."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            git -c http.extraheader="$AUTH" fetch --depth=1 origin "$STATE_BRANCH"
            git worktree add --no-checkout "$WORKTREE" FETCH_HEAD
            git -C "$WORKTREE" checkout FETCH_HEAD -- . 2>/dev/null || true
          else
            git worktree add --detach --no-checkout "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan "$STATE_BRANCH"
            git -C "$WORKTREE" rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p "$WORKTREE/data"
          cp data/events.jsonl "$WORKTREE/data/events.jsonl"
          # Only the event store: the payload is derived from it, and the deploy
          # check reads the live copy on gh-pages.
          git -C "$WORKTREE" rm -q --ignore-unmatch data/perf_eval.json
          git -C "$WORKTREE" add data
          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "Event store unchanged; nothing to persist."
          else
            git -C "$WORKTREE" commit -m "perf-eval state: run ${GITHUB_RUN_ID}"
            git -C "$WORKTREE" -c http.extraheader="$AUTH" push origin "HEAD:${STATE_BRANCH}"
          fi
          git worktree remove --force "$WORKTREE"

      - name: Build the site
        run: python scripts/build_site.py

      # Skip only on the scheduled runs, which are the churn worth avoiding.
      # Any other trigger is a deliberate act — a push to site/, a manual
      # dispatch, a finished-build dispatch — and should republish even if the
      # numbers are identical, since the page itself may have changed.
      - name: Deploy to GitHub Pages
        if: >-
          (steps.changed.outputs.changed == 'true' || github.event_name != 'schedule') &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # One commit, replaced on every deploy, as vllm-ci-dashboard does.
          # Otherwise gh-pages keeps every ~600 KB payload in history forever.
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'perf-eval dashboard: run ${{ github.run_id }}'

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Perf Eval collection"
            echo ""
            if [ "${{ steps.changed.outputs.changed }}" = "false" ] \
               && [ "${{ github.event_name }}" = "schedule" ]; then
              echo "- Deploy skipped: no new results since the last publish."
            fi
            if [ -f data/perf_eval.json ]; then
              python - <<'PY'
          import json, pathlib
          payload = json.loads(pathlib.Path("data/perf_eval.json").read_text())
          summary = payload.get("summary", {})
          print(f"- Generated at: `{payload.get('generated_at')}`")
          print(f"- Models: {summary.get('models')}")
          print(f"- Nightlies: {summary.get('nightlies')}")
          print(f"- Perf points: {summary.get('perf_points')}")
          print(f"- Accuracy points: {summary.get('accuracy_points')}")
          print(f"- AMD hardware: {', '.join(summary.get('amd_devices') or []) or 'none'}")
          PY
            else
              echo "- No payload was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
