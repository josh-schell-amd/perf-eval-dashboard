name: Secrets Scan

# Blocks a real-looking credential before it reaches a default branch.
#
# secrets_scan.py is instant, needs no install, and knows the token shapes this
# repo actually handles (GitHub and Buildkite). It is the same check a
# developer can run locally before pushing. Breadth across other providers,
# and git history, are left to GitHub secret scanning and push protection,
# which block a push before a token lands at all.
#
# Deliberately receives no Buildkite token.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shapes:
    name: Known token shapes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan the working tree
        run: python scripts/perf_eval/secrets_scan.py
