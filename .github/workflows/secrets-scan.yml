name: Secrets Scan

# Blocks a real-looking credential before it reaches a default branch.
# Two layers, deliberately:
#
#   secrets_scan.py  instant, no install, known token shapes only. The same
#                    check a developer can run locally before pushing.
#   gitleaks         ~150 maintained provider rules, and it scans git HISTORY
#                    as well as the working tree. A credential committed and
#                    then deleted leaves a clean tree but a dirty history,
#                    which the local check cannot see by construction.
#
# Deliberately receives no Buildkite token.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The gitleaks BINARY is MIT licensed and free. Only the gitleaks GitHub
  # Action requires a paid licence key for organisation-owned repos, which is
  # why this invokes the binary directly.
  GITLEAKS_VERSION: '8.21.2'

jobs:
  shapes:
    name: Known token shapes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan the working tree
        run: python scripts/perf_eval/secrets_scan.py

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the point of this job is to see commits whose
          # contents are no longer in the working tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan git history and working tree
        run: |
          set -euo pipefail
          # --redact keeps any finding out of the public log; the finding tells
          # you where to look, not what the value was.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose
