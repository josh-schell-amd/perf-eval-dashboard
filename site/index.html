function renderConfigsTab(){
  const host=document.getElementById('main');
  const configs=visibleConfigs();
  if(!configs.length){
    host.innerHTML='<div class="card"><div class="empty">No AMD nightly runs match these filters.</div></div>';
    return;
  }
  const baseline=BASELINE_BY_ID[state.baseline];
  const present=METRICS.filter(m=>configs.some(c=>pointsIn(c,m.key).length>0));

  let html='<div class="card"><h3>Latest value per configuration</h3>'+
    '<div class="card-hint">Newest run in the window, with its change against the '+
    'previous nightly. Changes under <b>'+thresholdLabel(baseline)+'</b> stay grey. '+
    'Click a cell for that metric\'s history.'+
    '</div><div class="table-scroll"><table><thead><tr>'+
    '<th>Configuration</th><th class="num">Runs</th>'+
    present.map(m=>'<th class="num">'+esc(m.label)+'<br><span class="neutral">'+esc(unitOf(m))+'</span></th>').join('')+
    '</tr></thead><tbody>';

  configs.forEach((c,ci)=>{
    const runs=Math.max(...present.map(m=>pointsIn(c,m.key).length),0);
    html+='<tr><td class="config">'+esc(c.label)+'</td><td class="num">'+runs+'</td>';
    present.forEach(m=>{
      const pts=pointsIn(c,m.key);
      if(!pts.length){html+='<td class="num neutral">—</td>';return;}
      const v=verdict(pts.map(p=>p.value),m,baseline);
      const cls=!v?'neutral':(v.severity==='alert'?'bad':v.severity==='warn'?'warnc':
        (v.improved&&v.magnitude>=baseline.warn)?'good':'neutral');
      html+='<td class="num clickable" data-cfg="'+ci+'" data-metric="'+esc(m.key)+'">'+
        esc(fmt(display(pts[pts.length-1].value,m),m.digits))+
        (v?' <span class="'+cls+'" style="font-size:11px">'+pct(v.ratio,1)+'</span>':'')+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';
  host.innerHTML=html;

  host.querySelectorAll('td[data-metric]').forEach(td=>{
    const config=configs[Number(td.getAttribute('data-cfg'))];
    const metric=METRIC_BY_KEY[td.getAttribute('data-metric')];
    if(!config||!metric)return;
    activatable(td,'Open history for '+config.label+' '+metric.label,()=>{
      const points=pointsIn(config,metric.key);
      openHistory(config.label+' — '+metric.label,
        (metric.direction==='higher'?'higher is better':'lower is better')+' · '+baseline.label,
        metric,points,verdict(points.map(p=>p.value),metric,baseline));
    });
  });
}

/* ============================================================================
   13. HISTORY OVERLAY
   ==========================================================================*/
function openHistory(title,subtitle,metric,points,v){
  // The chooser hides the chart; restore it in case we arrived from there.
  document.getElementById('history-chart-wrap').style.display='';
  document.getElementById('overlay-title').textContent=title;
  document.getElementById('overlay-sub').textContent=subtitle;

  const unit=unitOf(metric);
  const items=[
    {k:'Latest',v:fmt(display(points[points.length-1].value,metric),metric.digits)+' '+unit},
    {k:'Previous',v:v?fmt(display(v.base,metric),metric.digits)+' '+unit:'—'},
    {k:'Change',v:!v?'—':(metric.absolute?accuracyPoints(v.delta,true):pct(v.ratio,2))},
    {k:'Runs',v:String(points.length)},
  ];
  document.getElementById('overlay-summary').innerHTML=items.map(i=>
    '<div class="item"><div class="k">'+esc(i.k)+'</div><div class="v">'+esc(i.v)+'</div></div>').join('');

  const rows=points.slice().reverse();
  const table=document.getElementById('overlay-table');
  table.innerHTML=
    '<table><thead><tr><th>Date</th><th class="num">Value</th><th>vLLM commit</th>'+
    '<th>Image</th><th>Build</th></tr></thead><tbody>'+
    rows.map((p,i)=>'<tr'+(p.build_url?' class="clickable" data-row="'+i+'"':'')+'>'+
      '<td>'+esc(fmtDate(p.t))+'</td>'+
      '<td class="num">'+esc(fmt(display(p.value,metric),metric.digits))+'</td>'+
      '<td class="mono">'+esc(shortSha(p.vllm_commit))+'</td>'+
      '<td class="mono">'+esc(p.image||'—')+'</td>'+
      '<td>'+buildLink(p,null)+'</td></tr>').join('')+
    '</tbody></table>';

  // The row is what you are reading when you decide to open a build, so the
  // whole row opens it rather than the build number alone. The link stays in
  // the last column: it carries the arrow that says this leaves the page, and
  // it keeps middle-click and ctrl-click working.
  table.querySelectorAll('tr[data-row]').forEach(row=>{
    const point=rows[Number(row.getAttribute('data-row'))];
    if(!point)return;
    activatable(row,'Open build #'+(point.build_number||'?')+' in Buildkite',event=>{
      // That anchor navigates on its own; handling its click here as well
      // would open the build twice.
      if(event.target&&event.target.closest&&event.target.closest('a'))return;
      window.open(point.build_url,'_blank','noopener');
    });
  });

  const canvas=document.getElementById('history-chart');
  if(historyChart){historyChart.destroy();historyChart=null;}
  const theme=chartTheme();
  const accent=cssVar(metric.direction==='higher'?'--accent-blue':'--ui');
  historyChart=new Chart(canvas,{
    type:'line',
    data:{datasets:[{
      label:metric.label+(unit?' ('+unit+')':''),
      data:points.map(p=>({x:p.t,y:display(p.value,metric),_p:p})),
      borderColor:accent,backgroundColor:accent,
      borderWidth:2,pointRadius:3,tension:0,fill:false,
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      interaction:{mode:'index',intersect:false},
      scales:{
        x:{type:'linear',ticks:{color:theme.tick,maxTicksLimit:12,font:{size:10},
           maxRotation:0,callback:t=>fmtDate(t).slice(5,10)},grid:{color:theme.grid}},
        y:{afterDataLimits:floorYSpan,ticks:{color:theme.tick,font:{size:10}},grid:{color:theme.grid}},
      },
      plugins:{
        legend:{labels:{color:cssVar('--text-secondary')}},
        tooltip:{callbacks:{
          title:items=>fmtDate(items[0].parsed.x),
          afterBody:items=>{
            const p=points[items[0].dataIndex]||{};
            return ['vLLM commit: '+shortSha(p.vllm_commit),'Build: #'+(p.build_number||'?')];
          },
        }},
      },
    },
  });
  document.getElementById('overlay').classList.add('open');
}
// Open the full history for one clicked series, resolved back to its config so
// the overlay shows the whole trend rather than just the point that was hit.
function openSeriesHistory(candidate){
  const config=visibleConfigs().filter(c=>c.label===candidate.label)[0];
  const metric=candidate.metric;
  if(!config){
    // No matching config (a stale render); fall back to the single point so
    // the click still does something useful.
    openHistory(candidate.label+' — '+metric.label,
      fmtDate(candidate.point.t||0),metric,[candidate.point],null);
    return;
  }
  const points=pointsIn(config,metric.key);
  openHistory(config.label+' — '+metric.label,
    (metric.direction==='higher'?'higher is better':'lower is better')+
      ' · '+BASELINE_BY_ID[state.baseline].label,
    metric,points,verdict(points.map(p=>p.value),metric,BASELINE_BY_ID[state.baseline]));
}

// Several series on one point: name them and let the reader choose, rather
// than picking one and hoping it was the one they meant.
function openPointChooser(metric,candidates){
  if(historyChart){historyChart.destroy();historyChart=null;}
  document.getElementById('history-chart-wrap').style.display='none';
  document.getElementById('overlay-summary').innerHTML='';
  document.getElementById('overlay-title').textContent=
    candidates.length+' configurations at this point';
  document.getElementById('overlay-sub').textContent=
    metric.label+' · '+fmtDate(candidates[0].point.t||0)+
    ' · select one to see its history';

  document.getElementById('overlay-table').innerHTML='<div class="pick-list">'+
    candidates.map((c,index)=>
      '<button class="pick-item" data-pick="'+index+'">'+
      '<span class="pick-swatch" style="background:'+esc(c.color)+'"></span>'+
      '<span class="pick-label">'+esc(c.label)+'</span>'+
      '<span class="pick-value">'+esc(fmt(c.value,metric.digits))+' '+
      esc(unitOf(metric))+'</span></button>').join('')+'</div>';

  document.getElementById('overlay-table').querySelectorAll('button[data-pick]')
    .forEach(button=>button.addEventListener('click',()=>{
      const candidate=candidates[Number(button.getAttribute('data-pick'))];
      if(candidate)openSeriesHistory(candidate);
    }));

  document.getElementById('overlay').classList.add('open');
}

function closeHistory(){
  document.getElementById('overlay').classList.remove('open');
  if(historyChart){historyChart.destroy();historyChart=null;}
}

/* ============================================================================
   14. HASH STATE
   ==========================================================================*/
let suppressHash=false;
function syncToHash(){
  const parts=[];
  if(state.tab!=='trends')parts.push('tab='+state.tab);
  if(state.baseline!==DATA.default_baseline)parts.push('base='+state.baseline);
  if(chartDays()!==WINDOW_DAYS)parts.push('days='+chartDays());
  FACETS.forEach(f=>{
    const sel=[...state.selected[f.key]];
    if(sel.length)parts.push(f.key+'='+sel.map(encodeURIComponent).join(','));
  });
  suppressHash=true;
  window.location.hash=parts.join('&');
  setTimeout(()=>{suppressHash=false;},0);
}
function readFromHash(){
  const raw=(window.location.hash||'').replace(/^#/,'');
  state.tab='trends';
  state.baseline=DATA.default_baseline||'previous';
  state.chartDays=null;
  FACETS.forEach(f=>state.selected[f.key].clear());
  raw.split('&').forEach(chunk=>{
    const i=chunk.indexOf('=');
    if(i<0)return;
    const k=chunk.slice(0,i), v=chunk.slice(i+1);
    if(k==='tab'&&TABS.some(t=>t.id===v))state.tab=v;
    else if(k==='base'&&BASELINE_BY_ID[v])state.baseline=v;
    else if(k==='days'&&/^\d+$/.test(v))state.chartDays=Number(v);
    else{
      const facet=FACETS.find(f=>f.key===k);
      if(facet){
        v.split(',').map(decodeURIComponent).filter(Boolean)
          .forEach(val=>state.selected[k].add(val));
      }
    }
  });
  invalidateScan();
}

/* ============================================================================
   15. RENDER ROOT
   ==========================================================================*/
function renderAll(){
  // Any change of filter, window or baseline invalidates an open drill-down:
  // leaving it up would show one configuration's history over another's page.
  closeHistory();
  renderNotice();
  renderControls();
  renderKpis();
  renderCoveragePanel();
  renderTabs();
  if(state.tab==='trends')renderTrendsTab();
  else if(state.tab==='accuracy')renderAccuracyTab();
  else renderConfigsTab();
}

function renderChrome(){
  document.getElementById('generated-at').textContent='Generated '+(DATA.generated_at||'unknown');
  const url=(DATA.pipeline||{}).url||'https://buildkite.com/vllm/perf-eval';
  document.getElementById('pipeline-link').href=url;
  document.getElementById('pipeline-link-footer').href=url;
  // Report what the viewer is actually looking at. The payload's retention is
  // a property of the event store, not of this view — quoting "180 days" next
  // to a 14-day window only invites the question of which one is true.
  const retention=DATA.retention||{};
  const parts=['Showing the last '+WINDOW_DAYS+' days'];
  const nightlies=nightliesInWindow();
  if(nightlies)parts.push(nightlies+(nightlies===1?' nightly':' nightlies'));
  // Trimming is a fact about the published file, so it is labelled as such.
  // Nightlies inside the window are never trimmed, so this can only ever
  // mean older history was dropped — never that the view is short.
  if(retention.trimmed&&retention.nightlies_published){
    parts.push('older history trimmed to '+retention.nightlies_published+
               ' of '+retention.nightlies_available+' nightlies to fit the payload budget');
  }
  document.getElementById('retention-note').textContent=parts.join(' · ');
}

function wireChrome(){
  document.getElementById('theme-toggle').addEventListener('click',()=>{
    const light=document.documentElement.getAttribute('data-theme')==='light';
    if(light){document.documentElement.removeAttribute('data-theme');
              localStorage.setItem('perf-eval-theme','dark');}
    else{document.documentElement.setAttribute('data-theme','light');
         localStorage.setItem('perf-eval-theme','light');}
    // Chart.js resolves colours from CSS variables when a chart is built, so
    // everything has to be redrawn against the new palette.
    renderAll();
  });
  document.getElementById('copy-link').addEventListener('click',()=>{
    const btn=document.getElementById('copy-link');
    const restore=()=>{btn.textContent='Copy link';};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(window.location.href).then(
        ()=>{btn.textContent='Copied';setTimeout(restore,1500);},
        ()=>{btn.textContent='Copy failed';setTimeout(restore,1500);});
    }else{btn.textContent='Copy failed';setTimeout(restore,1500);}
  });
  document.getElementById('overlay-close').addEventListener('click',closeHistory);
  document.getElementById('overlay').addEventListener('click',e=>{
    if(e.target===document.getElementById('overlay'))closeHistory();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHistory();});
  window.addEventListener('hashchange',()=>{
    if(suppressHash)return;
    readFromHash();renderAll();
  });
}

function fail(msg){
  document.getElementById('main').innerHTML=
    '<div class="card"><div class="empty">'+esc(msg)+'</div></div>';
  document.getElementById('generated-at').textContent='Data unavailable';
}

// The build step rewrites this path with a content-hash cache tag.
fetch('perf_eval.json')
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(payload=>{
    DATA=payload;
    DATA.models=DATA.models||[];
    DATA.summary=DATA.summary||{};
    DATA.metric_meta=DATA.metric_meta||{};
    DATA.baselines=(DATA.baselines&&DATA.baselines.length)?DATA.baselines:[
      // Fallback for a payload written before `baselines` existed. Mirrors
      // aggregate.py's BASELINES, thresholds included, so the page cannot
      // silently apply a different rule than the one that produced the data.
      {id:'previous',label:'vs previous run',kind:'previous',baseline_window:1,
       warn:0.005,alert:null,accuracy_abs:0.01,
       description:'Compares the newest nightly against the run before it.'},
    ];
    DATA.default_baseline=DATA.default_baseline||DATA.baselines[0].id;
    BASELINE_BY_ID=Object.fromEntries(DATA.baselines.map(b=>[b.id,b]));

    // aggregate.py owns the window, because it also guarantees the payload
    // holds at least that much history.
    const windowDays=(DATA.retention||{}).display_window_days;
    if(Number.isFinite(windowDays)&&windowDays>0)WINDOW_DAYS=windowDays;

    // Metric display order comes from the payload, so adding a metric upstream
    // needs no frontend change.
    METRICS=Object.keys(DATA.metric_meta)
      .filter(k=>k!=='accuracy')
      .map(k=>({key:k,...DATA.metric_meta[k]}))
      .sort((a,b)=>(a.order==null?99:a.order)-(b.order==null?99:b.order));
    METRIC_BY_KEY=Object.fromEntries(METRICS.map(m=>[m.key,m]));

    CONFIGS=buildConfigs(DATA);
    ACC_TASKS=buildAccuracy(DATA);
    // Identity colours are assigned from the full dataset, not the filtered
    // view, so a series keeps its colour when filters change and across every
    // chart. Regressed series override this with red at render time.
    BASE_COLOR=Object.fromEntries(
      CONFIGS.map(c=>c.key).sort().map((k,i)=>[k,PALETTE[i%PALETTE.length]]));

    readFromHash();
    renderChrome();
    wireChrome();
    renderAll();
  })
  .catch(err=>fail('Could not load perf_eval.json: '+err.message));
})();
</script>
</body>
</html>
